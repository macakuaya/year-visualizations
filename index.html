<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Year visualization examples</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Year visualization examples</h1>
      <p>
        Mock activity for <strong id="year-label"></strong>. Each card is
        <strong>375px</strong> wide (mobile min). Tap or hover days where supported.
      </p>
      <label class="year-picker">
        Year
        <select id="year-select" aria-label="Year"></select>
      </label>
      <button id="share-btn" class="share-btn" type="button">
        Copy share link
      </button>
    </header>

    <main id="gallery" class="gallery"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
